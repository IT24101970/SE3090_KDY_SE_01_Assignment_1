[project]
name = "channel-center-safety-auditor"
version = "0.1.0"
description = "Deterministic, internal Safety Auditor service for ChannelCenter workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "langgraph==0.2.60",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
