name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/backend/**"

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore src/backend/ChannelCenter.sln

      - name: Build solution
        run: dotnet build src/backend/ChannelCenter.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test src/backend/ChannelCenter.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger "console;verbosity=detailed"
