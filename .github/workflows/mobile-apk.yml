name: Build Flutter Release APK

on:
  push:
    branches:
      - master
    paths:
      - 'src/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: |
          cd src/mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd src/mobile
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: channel-center-mobile-release-apk
          path: src/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ChannelCenter Mobile App v1.0.0"
          body: "Official Android release APK for ChannelCenter Mobile Application."
          files: src/mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
